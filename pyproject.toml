[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tian-xu-second-life"
version = "0.1.0"
description = "RPG kultivasi xianxia berbasis teks — vertical slice Fase 1 (Arc Akademi)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rian2602" }]
keywords = ["rpg", "xianxia", "wuxia", "text-game", "cultivation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Games/Entertainment",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Repository = "https://github.com/Rian2602/tianxu"
Issues = "https://github.com/Rian2602/tianxu/issues"
Documentation = "https://github.com/Rian2602/tianxu#readme"

[project.scripts]
tianxu = "src.cli:main"

# `src` adalah top-level package (src/__init__.py) dengan subpackage `engine`;
# discovery otomatis tidak mencakup root `src` — daftar eksplisit agar `src.cli`
# (console script) dan `src.engine` ikut terinstall.
[tool.setuptools]
packages = ["src", "src.engine"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
