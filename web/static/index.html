<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>天缘灵 · Tian Xu: Second Life — Arc Akademi</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <!-- ═══ Layar judul ═══ -->
  <div id="title-screen">
    <div class="title-box">
      <svg class="title-ornament top" width="220" height="22" viewBox="0 0 220 22" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M0 11 H80 M140 11 H220" stroke="currentColor" stroke-width="1.5" opacity="0.7"/>
        <circle cx="110" cy="11" r="4" fill="currentColor" opacity="0.9"/>
        <path d="M96 11 h4 M112 11 h4" stroke="currentColor" stroke-width="1.5"/>
      </svg>
      <h1 class="game-title">天缘灵</h1>
      <h2 class="game-subtitle">TIAN XU: SECOND LIFE</h2>
      <p class="game-tagline">Arc Akademi — Bukti Konsep Fase 1</p>
      <svg class="title-ornament bottom" width="220" height="22" viewBox="0 0 220 22" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M0 11 H80 M140 11 H220" stroke="currentColor" stroke-width="1.5" opacity="0.7"/>
        <circle cx="110" cy="11" r="4" fill="currentColor" opacity="0.9"/>
        <path d="M96 11 h4 M112 11 h4" stroke="currentColor" stroke-width="1.5"/>
      </svg>
      <button id="btn-new" class="btn btn-gold">Mulai Baru</button>
      <div id="save-slots" class="save-slots"></div>
      <p id="title-msg" class="title-msg"></p>
    </div>
  </div>

  <!-- ═══ Layar game ═══ -->
  <div id="game-screen" class="hidden">
    <header id="topbar">
      <div id="header-title" class="header-title"></div>
      <div class="topbar-right">
        <button id="btn-toggle-right" class="btn btn-small" onclick="toggleRightDrawer()">Quest · Inventori</button>
        <button id="btn-tianyuan" class="btn btn-small">天缘灵 · Panel</button>
      </div>
    </header>

    <div id="layout">
      <aside id="col-left" class="col"></aside>
      <main id="col-center" class="col">
        <div id="log" class="log"></div>
        <div id="interact" class="interact"></div>
      </main>
      <aside id="col-right" class="col"></aside>
    </div>
  </div>

  <!-- ═══ Panel Tianyuan Ling ═══ -->
  <div id="tianyuan" class="hidden tianyuan"></div>

  <!-- ═══ Modals ═══ -->
  <div id="modal-overlay" class="hidden modal-overlay"></div>
  <div id="modal-shop" class="hidden modal"></div>
  <div id="modal-arc-summary" class="hidden modal"></div>

  <script src="/static/app.js"></script>
</body>
</html>
