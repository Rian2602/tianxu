<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C0C0C0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C0C0C0;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="60" cy="60" r="58" fill="url(#bg)" stroke="#D4AF37" stroke-width="2"/>
  <!-- Decorative ring -->
  <circle cx="60" cy="60" r="52" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.5"/>
  <!-- Initial letter -->
  <text x="60" y="72" text-anchor="middle" font-family="Georgia, serif" font-size="48" font-weight="bold" fill="#F5F5DC" opacity="0.9">J</text>
  <!-- Name label -->
  <text x="60" y="108" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#D4AF37">Xu Jianxin</text>
</svg>